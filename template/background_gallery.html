<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VIBE 背景粒子动效预设库交互展示画廊 (Background Gallery)</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='5' fill='%23070d12'/><text x='12' y='17' font-size='13' font-weight='bold' text-anchor='middle' fill='%234ade80'>V</text></svg>">
<style>
  :root {
    --bg: #070d12;
    --panel: #0e1a22;
    --ink: #e8f1ec;
    --dim: #9cb1a9;
    --green: #4ade80;
    --cyan: #38bdf8;
    --amber: #fbbf24;
    --red: #f87171;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #03070a; color: var(--ink); font-family: "Noto Sans SC", -apple-system, sans-serif; overflow: hidden; }

  /* 居中 9:16 模拟画框 */
  .preview-wrapper {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #020406;
  }
  .stage-frame {
    position: relative;
    width: 100vw;
    height: 100vh;
    max-width: 56.25vh; /* 9:16 锁定 */
    background: radial-gradient(circle at 50% 30%, #0d1e28 0%, #070d12 80%);
    box-shadow: 0 0 40px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(148, 163, 184, 0.15);
    overflow: hidden;
  }
  #bg-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
  }

  /* 演示前景卡片 */
  .demo-overlay {
    position: absolute;
    inset: 0;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 0 6cqw;
    pointer-events: none;
  }
  .demo-badge {
    font-size: 14px;
    font-weight: 800;
    color: var(--green);
    background: rgba(74, 222, 128, 0.12);
    border: 1px solid rgba(74, 222, 128, 0.35);
    padding: 4px 14px;
    border-radius: 999px;
    margin-bottom: 12px;
    letter-spacing: 0.05em;
  }
  .demo-title {
    font-size: 28px;
    font-weight: 900;
    color: #ffffff;
    text-shadow: 0 0 20px rgba(74, 222, 128, 0.5);
    margin-bottom: 8px;
  }
  .demo-desc {
    font-size: 14px;
    color: var(--dim);
    max-width: 320px;
    line-height: 1.5;
  }

  /* 悬浮控制面板 */
  .control-dock {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 100;
    background: rgba(14, 26, 36, 0.88);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(148, 163, 184, 0.22);
    border-radius: 20px;
    padding: 14px 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
  }
  .preset-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .btn-preset {
    background: rgba(148, 163, 184, 0.1);
    color: var(--dim);
    border: 1px solid rgba(148, 163, 184, 0.2);
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .btn-preset:hover {
    background: rgba(74, 222, 128, 0.15);
    color: #fff;
    border-color: var(--green);
  }
  .btn-preset.active {
    background: var(--green);
    color: #070d12;
    border-color: var(--green);
    box-shadow: 0 0 16px rgba(74, 222, 128, 0.4);
  }

  .options-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    font-size: 13px;
    color: var(--dim);
  }
  .color-dots { display: flex; gap: 8px; }
  .color-dot {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid transparent;
  }
  .color-dot.active { border-color: #fff; transform: scale(1.15); }
  .btn-copy {
    background: rgba(56, 189, 248, 0.15);
    color: var(--cyan);
    border: 1px solid rgba(56, 189, 248, 0.35);
    padding: 4px 12px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }
</style>
</head>
<body>

<div class="preview-wrapper">
  <div class="stage-frame">
    <canvas id="bg-canvas"></canvas>

    <div class="demo-overlay">
      <div id="demoBadge" class="demo-badge">预设展示</div>
      <div id="demoTitle" class="demo-title">深海细胞光斑</div>
      <div id="demoDesc" class="demo-desc">多重景深微球向上漂浮，配合大柔焦光斑呼吸，农业与生物科普首选。</div>
    </div>
  </div>
</div>

<!-- 底部控制坞 -->
<div class="control-dock">
  <div class="preset-row">
    <button class="btn-preset active" data-p="bio-bubbles">1. 深海细胞光斑</button>
    <button class="btn-preset" data-p="constellation">2. 神经元能量网</button>
    <button class="btn-preset" data-p="dna-spiral">3. 双螺旋基因流</button>
    <button class="btn-preset" data-p="cyber-grid">4. 赛博透视网格</button>
    <button class="btn-preset" data-p="aurora-dust">5. 极光星尘漂移</button>
  </div>
  <div class="options-row">
    <span>主题色:</span>
    <div class="color-dots">
      <div class="color-dot active" style="background:#4ade80;" data-col="#4ade80" data-col2="#38bdf8"></div>
      <div class="color-dot" style="background:#38bdf8;" data-col="#38bdf8" data-col2="#4ade80"></div>
      <div class="color-dot" style="background:#fbbf24;" data-col="#fbbf24" data-col2="#f87171"></div>
      <div class="color-dot" style="background:#f87171;" data-col="#f87171" data-col2="#fbbf24"></div>
    </div>
    <button id="btnCopyCode" class="btn-copy">📋 复制引入代码</button>
    <span style="font-size:11px;opacity:0.6;">按 F11 全屏沉浸体验</span>
  </div>
</div>

<!-- 内联背景引擎库 -->
<script>
var VibeBackgrounds = (function () {
  "use strict";
  function parseColor(c, defaultColor) {
    if (!c) return defaultColor || { r: 74, g: 222, b: 128 };
    if (typeof c === "object" && c.r !== undefined) return c;
    if (c.startsWith("#")) {
      var hex = c.replace("#", "");
      if (hex.length === 3) hex = hex[0] + hex[0] + hex[1] + hex[1] + hex[2] + hex[2];
      var num = parseInt(hex, 16);
      return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
    }
    return { r: 74, g: 222, b: 128 };
  }

  function presetBioBubbles(cv, ctx, opt) {
    var W = cv.width, H = cv.height;
    var col = parseColor(opt.color, { r: 74, g: 222, b: 128 });
    var col2 = parseColor(opt.color2, { r: 56, g: 189, b: 248 });
    var count = Math.floor(45 * (opt.density || 1.0));
    var speed = (opt.speed || 1.0);
    var orbs = [];
    for (var i = 0; i < count; i++) {
      var layer = Math.random();
      var r = layer < 0.6 ? (Math.random() * 4 + 1.5) : (Math.random() * 26 + 10);
      var isCol2 = Math.random() < 0.35;
      orbs.push({
        x: Math.random() * W, y: Math.random() * H,
        r: r, baseR: r, layer: layer,
        color: isCol2 ? col2 : col,
        vy: -(Math.random() * 0.45 + 0.15) * speed * (0.6 + layer * 0.8),
        vx: (Math.random() - 0.5) * 0.25 * speed,
        alpha: layer < 0.6 ? (Math.random() * 0.4 + 0.2) : (Math.random() * 0.18 + 0.08),
        pulseSpeed: Math.random() * 0.03 + 0.015,
        pulseOffset: Math.random() * Math.PI * 2
      });
    }
    var frame = 0;
    return function draw() {
      ctx.clearRect(0, 0, W, H);
      frame++;
      for (var i = 0; i < orbs.length; i++) {
        var o = orbs[i];
        o.y += o.vy;
        o.x += o.vx + Math.sin(frame * 0.018 + o.pulseOffset) * 0.15;
        if (o.y < -o.r * 2) { o.y = H + o.r * 2; o.x = Math.random() * W; }
        if (o.x < -o.r * 2) o.x = W + o.r * 2;
        if (o.x > W + o.r * 2) o.x = -o.r * 2;
        var pulse = Math.sin(frame * o.pulseSpeed + o.pulseOffset) * 0.15 + 1.0;
        var curR = o.baseR * pulse;
        if (o.layer >= 0.6) {
          var grad = ctx.createRadialGradient(o.x, o.y, 0, o.x, o.y, curR);
          var a = o.alpha * pulse;
          grad.addColorStop(0, "rgba(" + o.color.r + "," + o.color.g + "," + o.color.b + "," + a + ")");
          grad.addColorStop(0.5, "rgba(" + o.color.r + "," + o.color.g + "," + o.color.b + "," + (a * 0.4) + ")");
          grad.addColorStop(1, "rgba(" + o.color.r + "," + o.color.g + "," + o.color.b + ", 0)");
          ctx.beginPath();
          ctx.arc(o.x, o.y, curR, 0, Math.PI * 2);
          ctx.fillStyle = grad;
          ctx.fill();
        } else {
          ctx.beginPath();
          ctx.arc(o.x, o.y, curR, 0, Math.PI * 2);
          ctx.fillStyle = "rgba(" + o.color.r + "," + o.color.g + "," + o.color.b + "," + o.alpha + ")";
          ctx.fill();
        }
      }
    };
  }

  function presetConstellation(cv, ctx, opt) {
    var W = cv.width, H = cv.height;
    var col = parseColor(opt.color, { r: 74, g: 222, b: 128 });
    var count = Math.floor(58 * (opt.density || 1.0));
    var speed = (opt.speed || 1.0);
    var maxDist = 180 * 180;
    var pts = [];
    for (var i = 0; i < count; i++) {
      pts.push({
        x: Math.random() * W, y: Math.random() * H,
        r: Math.random() * 2.8 + 1.2,
        vx: (Math.random() - 0.5) * 0.45 * speed,
        vy: (Math.random() - 0.5) * 0.45 * speed,
        a: Math.random() * 0.45 + 0.3
      });
    }
    var pulses = [];
    for (var k = 0; k < 6; k++) {
      pulses.push({ prog: Math.random(), speed: 0.015 * speed, pairIdx: 0 });
    }
    var frame = 0;
    return function draw() {
      ctx.clearRect(0, 0, W, H);
      frame++;
      for (var i = 0; i < pts.length; i++) {
        var p = pts[i];
        p.x += p.vx; p.y += p.vy;
        if (p.x < 0 || p.x > W) p.vx *= -1;
        if (p.y < 0 || p.y > H) p.vy *= -1;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(" + col.r + "," + col.g + "," + col.b + "," + p.a + ")";
        ctx.shadowColor = "rgba(" + col.r + "," + col.g + "," + col.b + ", 0.6)";
        ctx.shadowBlur = 8;
        ctx.fill();
        ctx.shadowBlur = 0;
      }
      var activePairs = [];
      for (var i = 0; i < pts.length; i++) {
        for (var j = i + 1; j < pts.length; j++) {
          var p1 = pts[i], p2 = pts[j];
          var dx = p1.x - p2.x, dy = p1.y - p2.y, d2 = dx * dx + dy * dy;
          if (d2 < maxDist) {
            var alpha = (1 - d2 / maxDist) * 0.22;
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.strokeStyle = "rgba(" + col.r + "," + col.g + "," + col.b + "," + alpha + ")";
            ctx.lineWidth = 1.2;
            ctx.stroke();
            if (activePairs.length < 24) activePairs.push([p1, p2]);
          }
        }
      }
      if (activePairs.length > 0) {
        for (var k = 0; k < pulses.length; k++) {
          var pulse = pulses[k];
          pulse.prog += pulse.speed;
          if (pulse.prog >= 1.0) {
            pulse.prog = 0;
            pulse.pairIdx = Math.floor(Math.random() * activePairs.length);
          }
          var pair = activePairs[pulse.pairIdx % activePairs.length];
          if (pair) {
            var qx = pair[0].x + (pair[1].x - pair[0].x) * pulse.prog;
            var qy = pair[0].y + (pair[1].y - pair[0].y) * pulse.prog;
            ctx.beginPath();
            ctx.arc(qx, qy, 2.2, 0, Math.PI * 2);
            ctx.fillStyle = "#ffffff";
            ctx.shadowColor = "rgba(" + col.r + "," + col.g + "," + col.b + ", 0.9)";
            ctx.shadowBlur = 10;
            ctx.fill();
            ctx.shadowBlur = 0;
          }
        }
      }
    };
  }

  function presetDnaSpiral(cv, ctx, opt) {
    var W = cv.width, H = cv.height;
    var col = parseColor(opt.color, { r: 56, g: 189, b: 248 });
    var col2 = parseColor(opt.color2, { r: 74, g: 222, b: 128 });
    var speed = (opt.speed || 1.0) * 0.022;
    var count = Math.floor(40 * (opt.density || 1.0));
    var sparks = [];
    for (var i = 0; i < count; i++) {
      sparks.push({ t: (i / count) * Math.PI * 4, y: (i / count) * H, r: Math.random() * 2.5 + 1.2 });
    }
    var frame = 0;
    return function draw() {
      ctx.clearRect(0, 0, W, H);
      frame++;
      var tOffset = frame * speed;
      var cx = W / 2, amplitude = W * 0.28;
      for (var i = 0; i < sparks.length; i++) {
        var s = sparks[i];
        s.y -= 1.4 * (opt.speed || 1.0);
        if (s.y < 0) s.y = H;
        var ang = s.t + tOffset + (s.y / H) * Math.PI * 3;
        var x1 = cx + Math.sin(ang) * amplitude, z1 = Math.cos(ang);
        var x2 = cx - Math.sin(ang) * amplitude, z2 = -z1;
        if (i % 2 === 0 && Math.abs(z1) < 0.7) {
          ctx.beginPath();
          ctx.moveTo(x1, s.y); ctx.lineTo(x2, s.y);
          ctx.strokeStyle = "rgba(148, 163, 184, " + (0.12 * (1 - Math.abs(z1))) + ")";
          ctx.lineWidth = 1; ctx.stroke();
        }
        var alpha1 = (z1 * 0.4 + 0.55), r1 = Math.max(1, s.r * (z1 * 0.35 + 1.0));
        ctx.beginPath(); ctx.arc(x1, s.y, r1, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(" + col.r + "," + col.g + "," + col.b + "," + alpha1 + ")"; ctx.fill();
        var alpha2 = (z2 * 0.4 + 0.55), r2 = Math.max(1, s.r * (z2 * 0.35 + 1.0));
        ctx.beginPath(); ctx.arc(x2, s.y, r2, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(" + col2.r + "," + col2.g + "," + col2.b + "," + alpha2 + ")"; ctx.fill();
      }
    };
  }

  function presetCyberGrid(cv, ctx, opt) {
    var W = cv.width, H = cv.height;
    var col = parseColor(opt.color, { r: 74, g: 222, b: 128 });
    var horizonY = H * 0.65, speed = (opt.speed || 1.0);
    var gridOffset = 0, stars = [];
    for (var s = 0; s < 30; s++) {
      stars.push({ x: Math.random() * W, y: Math.random() * horizonY, r: Math.random() * 1.8 + 0.8, a: Math.random() * 0.5 + 0.2 });
    }
    return function draw() {
      ctx.clearRect(0, 0, W, H);
      gridOffset = (gridOffset + 1.2 * speed) % 50;
      for (var i = 0; i < stars.length; i++) {
        var st = stars[i];
        ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(" + col.r + "," + col.g + "," + col.b + "," + st.a + ")"; ctx.fill();
      }
      var glowGrad = ctx.createLinearGradient(0, horizonY - 120, 0, horizonY + 80);
      glowGrad.addColorStop(0, "rgba(" + col.r + "," + col.g + "," + col.b + ", 0)");
      glowGrad.addColorStop(0.6, "rgba(" + col.r + "," + col.g + "," + col.b + ", 0.15)");
      glowGrad.addColorStop(1, "rgba(" + col.r + "," + col.g + "," + col.b + ", 0)");
      ctx.fillStyle = glowGrad; ctx.fillRect(0, horizonY - 120, W, 200);
      var cx = W / 2, numLines = 14;
      for (var l = -numLines; l <= numLines; l++) {
        var bottomX = cx + l * (W / 10);
        ctx.beginPath(); ctx.moveTo(cx, horizonY); ctx.lineTo(bottomX, H);
        ctx.strokeStyle = "rgba(" + col.r + "," + col.g + "," + col.b + ", 0.12)"; ctx.stroke();
      }
      for (var z = 10; z < H - horizonY; z += 35) {
        var curY = horizonY + Math.pow((z + gridOffset) / (H - horizonY), 1.8) * (H - horizonY);
        if (curY > horizonY && curY <= H) {
          var lineAlpha = ((curY - horizonY) / (H - horizonY)) * 0.22;
          ctx.beginPath(); ctx.moveTo(0, curY); ctx.lineTo(W, curY);
          ctx.strokeStyle = "rgba(" + col.r + "," + col.g + "," + col.b + "," + lineAlpha + ")"; ctx.stroke();
        }
      }
    };
  }

  function presetAuroraDust(cv, ctx, opt) {
    var W = cv.width, H = cv.height;
    var col = parseColor(opt.color, { r: 74, g: 222, b: 128 });
    var col2 = parseColor(opt.color2, { r: 56, g: 189, b: 248 });
    var speed = (opt.speed || 1.0), count = Math.floor(50 * (opt.density || 1.0));
    var dusts = [];
    for (var i = 0; i < count; i++) {
      dusts.push({
        x: Math.random() * W, y: Math.random() * H, r: Math.random() * 2.2 + 0.8,
        vy: -(Math.random() * 0.6 + 0.2) * speed, vx: (Math.random() - 0.5) * 0.3 * speed,
        a: Math.random() * 0.5 + 0.25, twinkleSpeed: Math.random() * 0.04 + 0.02
      });
    }
    var frame = 0;
    return function draw() {
      ctx.clearRect(0, 0, W, H);
      frame++;
      var a1 = Math.sin(frame * 0.012) * 0.04 + 0.09;
      var g1 = ctx.createRadialGradient(W * 0.3, H * 0.25, 0, W * 0.3, H * 0.25, W * 0.7);
      g1.addColorStop(0, "rgba(" + col.r + "," + col.g + "," + col.b + "," + a1 + ")");
      g1.addColorStop(1, "rgba(" + col.r + "," + col.g + "," + col.b + ", 0)");
      ctx.fillStyle = g1; ctx.fillRect(0, 0, W, H);
      var a2 = Math.cos(frame * 0.014) * 0.03 + 0.08;
      var g2 = ctx.createRadialGradient(W * 0.7, H * 0.6, 0, W * 0.7, H * 0.6, W * 0.8);
      g2.addColorStop(0, "rgba(" + col2.r + "," + col2.g + "," + col2.b + "," + a2 + ")");
      g2.addColorStop(1, "rgba(" + col2.r + "," + col2.g + "," + col2.b + ", 0)");
      ctx.fillStyle = g2; ctx.fillRect(0, 0, W, H);
      for (var i = 0; i < dusts.length; i++) {
        var d = dusts[i];
        d.y += d.vy; d.x += d.vx + Math.sin(frame * 0.02 + i) * 0.2;
        if (d.y < 0) { d.y = H; d.x = Math.random() * W; }
        if (d.x < 0) d.x = W; if (d.x > W) d.x = 0;
        var tw = Math.sin(frame * d.twinkleSpeed + i) * 0.3 + 0.7;
        ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(" + col.r + "," + col.g + "," + col.b + "," + (d.a * tw) + ")"; ctx.fill();
      }
    };
  }

  var PRESETS = {
    "bio-bubbles": presetBioBubbles,
    "constellation": presetConstellation,
    "dna-spiral": presetDnaSpiral,
    "cyber-grid": presetCyberGrid,
    "aurora-dust": presetAuroraDust
  };
  var animId = null, currentDraw = null;

  return {
    use: function (canvasId, presetName, options) {
      options = options || {};
      var cv = typeof canvasId === "string" ? document.getElementById(canvasId) : canvasId;
      if (!cv) return;
      var ctx = cv.getContext("2d");
      var factory = PRESETS[presetName] || PRESETS["bio-bubbles"];
      function resize() {
        cv.width = cv.parentElement ? cv.parentElement.clientWidth : window.innerWidth;
        cv.height = cv.parentElement ? cv.parentElement.clientHeight : window.innerHeight;
      }
      resize();
      currentDraw = factory(cv, ctx, options);
      if (animId) cancelAnimationFrame(animId);
      function loop() {
        if (currentDraw) currentDraw();
        animId = requestAnimationFrame(loop);
      }
      loop();
      window.removeEventListener("resize", cv._r || function(){});
      cv._r = function () { resize(); currentDraw = factory(cv, ctx, options); };
      window.addEventListener("resize", cv._r);
    }
  };
})();

// UI 控制联动
var curPreset = "bio-bubbles";
var curColor = "#4ade80";
var curColor2 = "#38bdf8";

var DESCS = {
  "bio-bubbles": { t: "深海细胞光斑", d: "多重景深微球向上漂浮，配合大柔焦光斑呼吸，农业与生物科普首选。" },
  "constellation": { t: "神经元能量网", d: "高能发光节点网格，脉冲能量光梭沿连线高速穿梭，硬科技机理首选。" },

  "cyber-grid": { t: "赛博透视网格", d: "3D 透视深空地平线网格推进与极光能量光束，芯片数码工业盘点首选。" },
  "aurora-dust": { t: "极光星尘漂移", d: "双色极光柔和漫射流转与深空星尘飘浮，高端纪实与商业智库风。" }
};

function switchPreset(p) {
  curPreset = p;
  document.querySelectorAll(".btn-preset").forEach(function(b) {
    b.classList.toggle("active", b.getAttribute("data-p") === p);
  });
  var meta = DESCS[p] || DESCS["bio-bubbles"];
  document.getElementById("demoTitle").textContent = meta.t;
  document.getElementById("demoDesc").textContent = meta.d;
  VibeBackgrounds.use("bg-canvas", curPreset, { color: curColor, color2: curColor2 });
}

document.querySelectorAll(".btn-preset").forEach(function(btn) {
  btn.addEventListener("click", function() {
    switchPreset(this.getAttribute("data-p"));
  });
});

document.querySelectorAll(".color-dot").forEach(function(dot) {
  dot.addEventListener("click", function() {
    document.querySelectorAll(".color-dot").forEach(function(d) { d.classList.remove("active"); });
    this.classList.add("active");
    curColor = this.getAttribute("data-col");
    curColor2 = this.getAttribute("data-col2");
    VibeBackgrounds.use("bg-canvas", curPreset, { color: curColor, color2: curColor2 });
  });
});

document.getElementById("btnCopyCode").addEventListener("click", function() {
  var snippet = "<!-- 引入背景引擎与一键挂载预设 -->\n" +
    "<script src=\"../../assets/backgrounds/backgrounds.js\"><\\/script>\n" +
    "<script>\n" +
    "  VibeBackgrounds.use('bg-canvas', '" + curPreset + "', { color: '" + curColor + "', color2: '" + curColor2 + "' });\n" +
    "<\\/script>";
  navigator.clipboard.writeText(snippet.replace(/\\/g, "")).then(function() {
    alert("已复制引入代码到剪贴板！可直接粘贴至任意作品 HTML 中。");
  }).catch(function() {
    alert("代码: VibeBackgrounds.use('bg-canvas', '" + curPreset + "')");
  });
});

// 首发运行
switchPreset("bio-bubbles");
</script>
