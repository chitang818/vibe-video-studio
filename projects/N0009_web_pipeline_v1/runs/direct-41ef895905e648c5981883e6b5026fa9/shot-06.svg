<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"><rect width="1080" height="1920" fill="#071d1b"/><text x="540" y="200" text-anchor="middle" fill="#ebc86d" font-size="30">结构草图 · 非最终素材</text><text x="540.0" y="480.0" text-anchor="middle" dominant-baseline="middle" fill="#eef9f3" font-family="Microsoft YaHei" font-size="36">不止大量元素</text><text x="300.0" y="810.0" text-anchor="middle" dominant-baseline="middle" fill="#eef9f3" font-family="Microsoft YaHei" font-size="36">还关注微量元素</text><text x="780.0" y="810.0" text-anchor="middle" dominant-baseline="middle" fill="#eef9f3" font-family="Microsoft YaHei" font-size="36">锌、铜、铁等</text><text x="540.0" y="1145.0" text-anchor="middle" dominant-baseline="middle" fill="#eef9f3" font-family="Microsoft YaHei" font-size="36">减少缺素症状</text><text x="540.0" y="1355.0" text-anchor="middle" dominant-baseline="middle" fill="#eef9f3" font-family="Microsoft YaHei" font-size="36">关注贫瘠土壤条件</text></svg>